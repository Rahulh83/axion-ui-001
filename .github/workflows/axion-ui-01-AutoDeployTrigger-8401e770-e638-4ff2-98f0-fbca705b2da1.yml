name: Trigger auto deployment for axion-ui-01

on:
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/axion-ui-01-AutoDeployTrigger-8401e770-e638-4ff2-98f0-fbca705b2da1.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AXIONUI01_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AXIONUI01_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AXIONUI01_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          acrName: conapp
          registryUrl: conapp.azurecr.io
          registryUsername: ${{ secrets.AXIONUI01_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.AXIONUI01_REGISTRY_PASSWORD }}
          containerAppName: axion-ui-01
          resourceGroup: rahul-rg
          imageToBuild: conapp.azurecr.io/axion-ui-01:${{ github.sha }}
          dockerfilePath: Dockerfile
