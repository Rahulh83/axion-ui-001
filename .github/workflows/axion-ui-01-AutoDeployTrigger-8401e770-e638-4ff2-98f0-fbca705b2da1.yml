name: Trigger auto deployment for axion-ui-01

on:
  workflow_run:
    workflows:
      - Build & Push Docker Image to ACR
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AXIONUI01_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AXIONUI01_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AXIONUI01_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy existing image to Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: conapp
          containerAppName: axion-ui-01
          resourceGroup: rahul-rg
          imageToDeploy: conapp.azurecr.io/axion-ui:${{ github.event.workflow_run.head_sha || github.sha }}
        
