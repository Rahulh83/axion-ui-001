name: Build & Push Docker Image to ACR

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: conapp.azurecr.io
  DOCKER_IMAGE: conapp.azurecr.io/axion-ui

jobs:
  build-and-push:
    name: Build & Push to Azure Container Registry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            conapp.azurecr.io/axion-ui:${{ github.sha }}
            conapp.azurecr.io/axion-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
